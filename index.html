<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RAID</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAID">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
:root{
  --bg:#000;--fg:#d9d8d2;--hi:#fff;--mute:#64635e;--line:#1f1f1d;--c2:#45453f;--red:#e3262f;
  --m:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.5 var(--m);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--hi);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 150px) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px}
.lbl{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
b{color:var(--hi);font-weight:600}

.top{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.top .r{display:flex;gap:8px;align-items:center}
.top button{border:1px solid var(--line);padding:3px 7px;letter-spacing:.18em}
.top button.arm{border-color:var(--red);color:var(--red)}

.sh{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh i{color:var(--hi);font-style:normal}
.caret{display:inline-block;width:7px;height:12px;background:var(--hi);vertical-align:-2px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hx{font:800 clamp(40px,12.5vw,64px)/.92 var(--m);letter-spacing:-.07em;color:var(--hi);margin:8px 0 0}
.hx span{display:block;color:var(--mute);font-weight:300;letter-spacing:-.05em}
.st{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:8px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border:1px solid var(--line);padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wd small{font-size:8px;letter-spacing:.16em;color:var(--mute)}
.wd span{font-size:15px;font-weight:700;color:var(--hi)}
.wd.rest span{color:var(--c2);font-weight:400}
.wd.today{border-color:var(--hi)}

.pick{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
.pick button{padding:10px 0;font-size:10px;letter-spacing:.18em;color:var(--mute)}
.pick button+button{border-left:1px solid var(--line)}
.pick button.on{background:var(--hi);color:#000;font-weight:700}
.pick button:disabled:not(.on){opacity:.3}

.prog{height:2px;background:var(--line);position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--hi);transition:width .3s}

.ex{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px dashed var(--line)}
.ex .nm{font-size:12px;font-weight:700;color:var(--hi);text-transform:uppercase;letter-spacing:.04em}
.ex .nm::before{content:"> ";color:var(--mute)}
.rx{display:flex;align-items:baseline;gap:12px}
.rx .w{font:700 36px/1 var(--m);letter-spacing:-.05em;color:var(--hi)}
.rx .w small{font-size:9px;letter-spacing:.18em;color:var(--mute);margin-left:4px;font-weight:400}
.rx .r{font-size:20px;color:var(--fg)}
.rx .cal{margin-left:auto;display:flex;gap:4px}
.rx .cal button{width:30px;height:28px;border:1px solid var(--line);color:var(--mute)}
.why{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.why.dn{color:var(--red)}
.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sb{height:60px;border:1px solid var(--c2);font:700 20px/1 var(--m)}
.sb.ok{background:var(--hi);color:#000;border-color:var(--hi)}
.sb.no{border-color:var(--red);color:var(--red)}

.ok{border:1px solid var(--hi);padding:14px;display:flex;flex-direction:column;gap:4px;font-size:11px}
.ok .h{font-weight:700;color:var(--hi);letter-spacing:.06em}
.ok .h::before{content:"[ OK ] ";color:var(--mute)}

.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi .v{font:700 26px/1 var(--m);letter-spacing:-.04em;color:var(--hi)}
.kpi .v small{font-size:10px;color:var(--mute);font-weight:400;margin-left:2px}
.panel{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px dashed var(--line)}
.panel .hd{display:flex;justify-content:space-between;align-items:baseline}
.read{font-size:10px;color:var(--fg);min-height:15px}
svg{display:block;width:100%;overflow:visible}
.exr{display:grid;grid-template-columns:minmax(0,1fr) 76px auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.exr .n{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.exr .v{font-size:11px;text-align:right;white-space:nowrap}
.exr .v small{color:var(--mute)}
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:10px}
.blk .a{color:var(--hi);font-weight:700}
.blk .m{color:var(--mute)}
.blk .x{text-align:right}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#000;border-top:1px solid var(--line);padding:0 max(18px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(18px,env(safe-area-inset-left))}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
nav button{height:54px;font-size:10px;letter-spacing:.24em;color:var(--mute)}
nav button.on{color:var(--hi)}
nav button.on::before{content:"▸ "}

.timer{position:fixed;left:0;right:0;bottom:calc(55px + env(safe-area-inset-bottom));z-index:21;background:var(--hi);color:#000;padding:10px max(18px,env(safe-area-inset-right)) 10px max(18px,env(safe-area-inset-left))}
.timer[hidden]{display:none}
.timer .in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer .t{font:700 30px/1 var(--m);letter-spacing:-.04em}
.timer .l{font-size:9px;letter-spacing:.22em;text-transform:uppercase}
.timer .b{display:flex;gap:6px}
.timer .b button{border:1px solid #000;padding:7px 10px;font-size:11px}
.timer.go{background:var(--red);color:#fff}
.timer.go .b button{border-color:#fff}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="timer" id="timer" hidden><div class="in">
  <div><div class="l" id="tl">cooldown</div><div class="t" id="tt">2:30</div></div>
  <div class="b"><button data-a="tm">−15</button><button data-a="tp">+15</button><button data-a="ts">×</button></div>
</div></div>
<nav><div class="in"><button data-a="tab" data-t="mine">MINE</button><button data-a="tab" data-t="ledger">LEDGER</button></div></nav>
<script>
(function(){
'use strict';
var KEY='raid.v2';
var NAME={A:'PUSH',B:'PULL',C:'LEGS'};
var PLAN={
  A:[
    {id:'bench',n:'Жим штанги лёжа',s:3,r:8,rest:150,w0:30,st:2.5},
    {id:'incline',n:'Жим гантелей на наклонной',s:3,r:10,rest:150,w0:10,st:1,db:1},
    {id:'dbpress',n:'Жим гантелей сидя',s:3,r:10,rest:120,w0:8,st:1,db:1},
    {id:'pushdown',n:'Разгибания на трицепс, блок',s:3,r:12,rest:105,w0:15,st:2.5},
    {id:'french',n:'Французский жим',s:2,r:12,rest:105,w0:15,st:2.5}
  ],
  B:[
    {id:'pulldown',n:'Верхний блок к груди',s:3,r:10,rest:150,w0:35,st:2.5},
    {id:'row',n:'Тяга штанги в наклоне',s:3,r:10,rest:150,w0:30,st:2.5},
    {id:'cablerow',n:'Тяга горизонтального блока',s:3,r:12,rest:120,w0:30,st:2.5},
    {id:'curl',n:'Сгибания на бицепс',s:3,r:12,rest:105,w0:8,st:1,db:1},
    {id:'hammer',n:'Молотки',s:2,r:12,rest:105,w0:8,st:1,db:1}
  ],
  C:[
    {id:'squat',n:'Присед или жим ногами',s:3,r:10,rest:150,w0:40,st:2.5},
    {id:'rdl',n:'Румынская тяга',s:3,r:10,rest:150,w0:40,st:2.5},
    {id:'legcurl',n:'Сгибания ног в тренажёре',s:3,r:12,rest:105,w0:20,st:2.5},
    {id:'calf',n:'Подъёмы на носки',s:3,r:15,rest:90,w0:30,st:2.5}
  ]
};
var EX={};Object.keys(PLAN).forEach(function(t){PLAN[t].forEach(function(x){EX[x.id]=x})});
var WD=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'],ORDER=[1,2,3,4,5,6,0];

function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function days(a,b){var p=function(k){var x=k.split('-');return new Date(+x[0],x[1]-1,+x[2])};return Math.round((p(b)-p(a))/864e5)}
function num(x){return String(x).replace('.',',')}
function hex(n,l){return '0x'+n.toString(16).toUpperCase().padStart(l||4,'0')}
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return ('0000000'+h.toString(16)).slice(-8)}
function sp(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function dm(k){return k.slice(8)+'.'+k.slice(5,7)}

var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.log)S={log:[],abst:{start:today(),best:0}};
if(!S.sched)S.sched={1:'A',3:'B',5:'C'};
var UI={tab:'mine',pick:null,armed:0,sel:-1};
try{UI.tab=localStorage.getItem(KEY+'.tab')||'mine'}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* незакрытая тренировка прошлого дня закрывается: неотмеченное = провал */
(function(){var L=S.log[S.log.length-1];if(L&&!L.done&&L.d<today()){(PLAN[L.t]||[]).forEach(function(x){var e=L.ex[x.id];if(!e)return;for(var i=0;i<x.s;i++)if(e.s[i]!==1)e.s[i]=0});L.done=true;save()}})();

function current(){var L=S.log[S.log.length-1];return L&&!L.done?L:null}
function dayType(){var w=new Date().getDay();if(S.sched[w])return S.sched[w];for(var i=1;i<7;i++){var t=S.sched[(w+i)%7];if(t)return t}return 'A'}
function hist(id,upto){var out=[];for(var i=upto-1;i>=0;i--){var e=S.log[i].ex[id];if(e&&e.s.some(function(v){return v===1||v===0}))out.push(e)}return out}
function passed(x,e){for(var i=0;i<x.s;i++)if(e.s[i]!==1)return false;return true}
function rnd(v,st){return Math.max(st,Math.round(v/st)*st)}
/* законы веса: закрыл всё → +шаг; провал → тот же; два провала подряд → −10% */
function rx(x,idx){
  var cur=idx<S.log.length?S.log[idx].ex[x.id]:null;
  if(cur&&typeof cur.cal==='number')return {w:cur.cal,why:'manual override'};
  var h=hist(x.id,idx);
  if(!h.length)return {w:x.w0,why:'genesis weight'};
  if(passed(x,h[0]))return {w:+(h[0].w+x.st).toFixed(1),why:'prev tx valid · +'+num(x.st)+' кг'};
  if(h[1]&&!passed(x,h[1])&&h[1].w===h[0].w)return {w:rnd(h[0].w*.9,x.st),why:'2× tx failed · rollback −10%',dn:1};
  return {w:h[0].w,why:'prev tx failed · retry same weight'};
}
function tonnage(L){var t=0;Object.keys(L.ex).forEach(function(id){var x=EX[id],e=L.ex[id];if(!x)return;e.s.forEach(function(v){if(v===1)t+=e.w*(x.db?2:1)*x.r})});return t}
function sets(L){var ok=0,all=0;Object.keys(L.ex).forEach(function(id){L.ex[id].s.forEach(function(v){if(v===1||v===0)all++;if(v===1)ok++})});return {ok:ok,all:all}}
function chain(){var prev='0000000000000000',out=[];S.log.forEach(function(L,i){if(!L.done)return;var h=fnv(prev+L.d+L.t+JSON.stringify(L.ex))+fnv(L.d+prev+i);out.push({i:i,L:L,h:h,p:prev,ton:tonnage(L),s:sets(L)});prev=h});return out}

function render(){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===UI.tab)});
  var ad=Math.max(0,days(S.abst.start,today()));
  var h='<div class="top"><span>raid//node</span><span class="r">uptime <b>'+ad+'d</b>'+(S.abst.best>ad?' · max '+S.abst.best+'d':'')+
    '<button data-a="ab" class="'+(UI.armed?'arm':'')+'">'+(UI.armed?'confirm':'reset')+'</button></span></div>';
  h+=UI.tab==='ledger'?ledger():mine();
  document.getElementById('app').innerHTML=h;
}

function mine(){
  var cur=current(),idx=cur?S.log.length-1:S.log.length,t=cur?cur.t:(UI.pick||dayType()),plan=PLAN[t];
  var ch=chain(),last=ch[ch.length-1],prev=last?last.h:'0000000000000000';
  var marked=0,total=0;plan.forEach(function(x){total+=x.s;var e=cur&&cur.ex[x.id];if(e)e.s.forEach(function(v){if(v===1||v===0)marked++})});
  var h='';
  if(last&&last.L.d===today()&&!cur){
    h+='<div class="ok"><div class="h">BACELAUR '+hex(ch.length)+' CONFIRMED</div><div>hash <b>0x'+last.h+'</b></div><div class="lbl">'+NAME[last.L.t]+' · '+sp(last.ton)+' кг · '+last.s.ok+'/'+last.s.all+' tx valid</div></div>';
  }
  h+='<header><div class="sh">root@raid:~$ <i>./mine --height '+(ch.length+1)+' --sig '+NAME[t].toLowerCase()+'</i><span class="caret"></span></div>'+
     '<div class="hx">BACELAUR<span>'+hex(ch.length+1)+'</span></div>'+
     '<div class="st"><span>status <b>'+(cur?'mining':'awaiting tx')+'</b></span><span>prev <b>0x'+prev.slice(0,6)+'…'+prev.slice(-4)+'</b></span><span>tx <b>'+marked+'/'+total+'</b></span></div></header>';
  var w=new Date().getDay();
  h+='<div><div class="lbl" style="margin-bottom:6px">schedule</div><div class="week">'+ORDER.map(function(d){var s=S.sched[d];return '<button class="wd'+(s?'':' rest')+(d===w?' today':'')+'" data-a="sd" data-d="'+d+'"><small>'+WD[d]+'</small><span>'+(s||'·')+'</span></button>'}).join('')+'</div></div>';
  h+='<div class="pick">'+['A','B','C'].map(function(k){return '<button data-a="pk" data-t="'+k+'" class="'+(k===t?'on':'')+'"'+(cur?' disabled':'')+'>'+k+' '+NAME[k]+'</button>'}).join('')+'</div>';
  h+='<div class="prog"><i style="width:'+(marked/total*100)+'%"></i></div>';
  plan.forEach(function(x){
    var p=rx(x,idx),e=cur&&cur.ex[x.id],started=e&&e.s.some(function(v){return v===1||v===0});
    h+='<section class="ex"><div class="nm">'+x.n+'</div><div class="rx"><span class="w">'+num(p.w)+'<small>KG'+(x.db?' ×2':'')+'</small></span><span class="r">'+x.s+'×'+x.r+'</span>'+
      (started?'':'<span class="cal"><button data-a="c" data-x="'+x.id+'" data-d="-1" aria-label="легче">−</button><button data-a="c" data-x="'+x.id+'" data-d="1" aria-label="тяжелее">+</button></span>')+
      '</div><div class="why'+(p.dn?' dn':'')+'">'+p.why+'</div><div class="sets">';
    for(var i=0;i<x.s;i++){var v=e?e.s[i]:null;h+='<button class="sb'+(v===1?' ok':v===0?' no':'')+'" data-a="s" data-x="'+x.id+'" data-i="'+i+'">'+(v===1?'✓':v===0?'✗':(i+1))+'</button>'}
    h+='</div></section>';
  });
  h+='<div class="lbl" style="line-height:1.8">✓ valid tx — все повторы чисто · 2-й тап ✗ failed · все ✓ → next block heavier</div>';
  return h;
}

function ledger(){
  var ch=chain(),n=ch.length;
  var h='<header><div class="sh">root@raid:~$ <i>./ledger --verify</i><span class="caret"></span></div><div class="st"><span>'+(n?'> '+n+' bacelaur blocks · chain valid':'> ledger empty · mine genesis block')+'</span></div></header>';
  if(!n)return h;
  var tot=0,ok=0,all=0;ch.forEach(function(b){tot+=b.ton;ok+=b.s.ok;all+=b.s.all});
  h+='<div class="kpi"><div><div class="v">'+n+'</div><div class="lbl">mined</div></div><div><div class="v">'+(tot>=10000?num((tot/1000).toFixed(1))+'<small>t</small>':sp(tot)+'<small>kg</small>')+'</div><div class="lbl">tonnage</div></div><div><div class="v">'+(all?Math.round(ok/all*100):0)+'<small>%</small></div><div class="lbl">tx valid</div></div></div>';

  /* тоннаж по блокам */
  var bars=ch.slice(-24),W=320,H=110,max=Math.max.apply(null,bars.map(function(b){return b.ton}))||1,bw=W/24,g='';
  for(var y=0;y<=2;y++){var yy=H-H*y/2;g+='<line x1="0" x2="'+W+'" y1="'+yy+'" y2="'+yy+'" stroke="#1f1f1d" stroke-width="1"/>'}
  bars.forEach(function(b,i){var bh=Math.max(2,b.ton/max*(H-6)),x=i*bw+2,sel=UI.sel===b.i;
    g+='<rect x="'+x+'" y="'+(H-bh)+'" width="'+(bw-4)+'" height="'+bh+'" rx="1.5" fill="'+(sel?'#fff':(b.s.ok<b.s.all?'#45453f':'#bdbcb6'))+'"/>'+
       '<rect data-a="bar" data-i="'+b.i+'" x="'+(i*bw)+'" y="0" width="'+bw+'" height="'+H+'" fill="transparent" style="cursor:pointer"/>'});
  var sb=ch.filter(function(b){return b.i===UI.sel})[0]||ch[n-1];
  h+='<section class="panel"><div class="hd"><span class="lbl">tonnage / bacelaur</span><span class="lbl">max '+sp(max)+' kg</span></div>'+
     '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px" role="img" aria-label="Тоннаж по тренировкам">'+g+'</svg>'+
     '<div class="read">> '+hex(ch.indexOf(sb)+1)+' · '+dm(sb.L.d)+' · '+NAME[sb.L.t]+' · <b>'+sp(sb.ton)+' kg</b> · '+sb.s.ok+'/'+sb.s.all+' valid</div></section>';

  /* прогресс по упражнениям */
  var rows='';
  Object.keys(EX).forEach(function(id){
    var pts=ch.map(function(b){var e=b.L.ex[id];return e&&e.s.some(function(v){return v===1||v===0})?e.w:null}).filter(function(v){return v!==null});
    if(!pts.length)return;
    var lo=Math.min.apply(null,pts),hi=Math.max.apply(null,pts),sw=76,sh=20,d='';
    pts.forEach(function(v,i){var x=pts.length>1?i/(pts.length-1)*sw:sw/2,y=hi===lo?sh/2:sh-(v-lo)/(hi-lo)*(sh-4)-2;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)});
    var lx=pts.length>1?sw:sw/2,ly=hi===lo?sh/2:2;var dl=pts[pts.length-1]-pts[0];
    rows+='<div class="exr"><span class="n">'+EX[id].n+'</span><svg viewBox="0 0 '+sw+' '+sh+'" style="height:'+sh+'px" aria-hidden="true"><path d="'+d+'" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><circle cx="'+lx+'" cy="'+ly+'" r="2.5" fill="#fff"/></svg><span class="v"><b>'+num(pts[pts.length-1])+'</b> <small>'+(dl>0?'+':dl<0?'−':'±')+num(Math.abs(dl))+'</small></span></div>';
  });
  h+='<section class="panel"><div class="hd"><span class="lbl">weight / exercise</span><span class="lbl">kg · Δ since genesis</span></div><div>'+rows+'</div></section>';

  /* сам реестр */
  var bl='';ch.slice().reverse().slice(0,30).forEach(function(b,j){var k=n-j;
    bl+='<div class="blk"><span class="a">'+hex(k)+'</span><span>'+NAME[b.L.t]+' · '+dm(b.L.d)+'</span><span class="x">'+sp(b.ton)+' kg</span>'+
        '<span class="m">0x'+b.h.slice(0,8)+'</span><span class="m">prev 0x'+b.p.slice(0,8)+'</span><span class="x m">'+b.s.ok+'/'+b.s.all+'</span></div>'});
  h+='<section class="panel"><div class="hd"><span class="lbl">chain</span><span class="lbl">latest first</span></div><div>'+bl+'</div></section>';
  return h;
}

function ensure(t){var cur=current();if(cur)return cur;cur={d:today(),t:t,ex:{},done:false};S.log.push(cur);return cur}
function finishIfDone(cur){var all=PLAN[cur.t].every(function(x){var e=cur.ex[x.id];if(!e)return false;for(var i=0;i<x.s;i++)if(e.s[i]!==1&&e.s[i]!==0)return false;return true});if(all)cur.done=true;return all}

var end=0,iv=null,rang=false,lock=null;
function beep(){try{var C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.7);o.start();o.stop(a.currentTime+.7)}catch(e){}if(navigator.vibrate)navigator.vibrate([200,80,200])}
function tick(){var s=Math.round((end-Date.now())/1000),el=document.getElementById('timer'),a=Math.abs(s);
  document.getElementById('tt').textContent=(s<0?'+':'')+Math.floor(a/60)+':'+pad(a%60);
  if(s<=0){el.classList.add('go');document.getElementById('tl').textContent='execute next tx';if(!rang){rang=true;beep()}}}
function timer(sec){end=Date.now()+sec*1000;rang=false;var el=document.getElementById('timer');el.hidden=false;el.classList.remove('go');document.getElementById('tl').textContent='cooldown';clearInterval(iv);iv=setInterval(tick,250);tick();awake()}
function stop(){clearInterval(iv);document.getElementById('timer').hidden=true}
async function awake(){try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',function(){lock=null})}}catch(e){}}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
  if(a==='tab'){UI.tab=b.dataset.t;try{localStorage.setItem(KEY+'.tab',UI.tab)}catch(e){}render();window.scrollTo(0,0);return}
  if(a==='pk'){if(!current()){UI.pick=b.dataset.t;render()}return}
  if(a==='sd'){var d=+b.dataset.d,c=S.sched[d],nx=c==='A'?'B':c==='B'?'C':c==='C'?null:'A';if(nx)S.sched[d]=nx;else delete S.sched[d];save();render();return}
  if(a==='bar'){UI.sel=+b.dataset.i;render();return}
  if(a==='s'||a==='c'){
    var t=current()?current().t:(UI.pick||dayType()),cur=ensure(t),idx=S.log.length-1,x=PLAN[cur.t].find(function(q){return q.id===b.dataset.x}),p=rx(x,idx);
    var e=cur.ex[x.id]||(cur.ex[x.id]={w:p.w,s:[]});
    if(a==='c'){var nw=+(p.w+x.st*(+b.dataset.d)).toFixed(1);if(nw>=x.st){e.cal=nw;e.w=nw}save();render();return}
    var i=+b.dataset.i,v=e.s[i];e.w=p.w;e.s[i]=v===1?0:v===0?null:1;
    var fin=finishIfDone(cur);if(fin)UI.pick=null;save();render();
    if(fin){stop();window.scrollTo({top:0,behavior:'smooth'})}else if(e.s[i]!==null)timer(x.rest);
    return;
  }
  if(a==='ab'){
    if(!UI.armed){UI.armed=1;render();setTimeout(function(){UI.armed=0;render()},3000);return}
    var ad=Math.max(0,days(S.abst.start,today()));S.abst.best=Math.max(S.abst.best||0,ad);S.abst.start=today();UI.armed=0;save();render();return;
  }
  if(a==='tm'){end-=15000;tick();return}
  if(a==='tp'){end+=15000;tick();return}
  if(a==='ts'){stop();return}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
